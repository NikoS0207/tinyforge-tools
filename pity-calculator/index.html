<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hard Pity Calculator | TinyForge Game Tools</title><meta name="description" content="Free hard-pity calculator for game designers and players. Model base drop chance, pity start, chance increase and guaranteed pull."><style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 18px;background:#10131a;color:#eef}input{width:120px;padding:8px;margin:5px}button{padding:10px 16px}.card{background:#181d28;padding:22px;border-radius:14px;margin:18px 0}a{color:#8bd}</style></head><body><h1>Hard Pity Calculator</h1><p>Model a simple increasing-chance pity system. Free, local, no signup.</p><div class="card"><label>Base chance % <input id="b" type="number" value="1" step="0.1"></label><br><label>Pity starts at pull <input id="s" type="number" value="50"></label><br><label>Increase per pull % <input id="i" type="number" value="2" step="0.1"></label><br><label>Guaranteed by pull <input id="g" type="number" value="90"></label><br><button onclick="calc()">Calculate</button><p id="o"></p></div><p><a href="../dropchance/">DropChance calculator</a> · <a href="../">TinyForge Game Tools</a></p><script>function calc(){let b=+document.querySelector('#b').value/100,s=+document.querySelector('#s').value,i=+document.querySelector('#i').value/100,g=+document.querySelector('#g').value,fail=1,exp=0,med=0,p90=0;for(let n=1;n<=g;n++){let p=n>=g?1:Math.min(1,b+(n>=s?(n-s+1)*i:0));let before=fail;fail*=1-p;exp+=n*before*p;if(!med&&1-fail>=.5)med=n;if(!p90&&1-fail>=.9)p90=n}document.querySelector('#o').innerHTML=`Expected pull: <b>${exp.toFixed(2)}</b><br>50% acquired by: <b>${med||g}</b><br>90% acquired by: <b>${p90||g}</b><br>Guaranteed by: <b>${g}</b>`}</script></body></html>

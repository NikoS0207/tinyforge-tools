<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drop Rate Calculator — TinyForge Tools</title><meta name="description" content="Calculate cumulative drop odds, dry streak chance, expected drops, confidence milestones and grind time for rare loot."><style>body{font-family:system-ui;max-width:850px;margin:40px auto;padding:0 18px;background:#0b1020;color:#eef2ff}input,button{padding:10px;margin:5px;border-radius:8px;border:1px solid #475569}button{cursor:pointer}.card{background:#151c32;padding:18px;border-radius:14px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}a{color:#7dd3fc}</style></head><body><h1>Drop Rate Calculator</h1><p>See how unlucky (or lucky) a grind really is.</p><div class="card"><label>Drop chance (%) <input id="p" type="number" step="any" value="1"></label><label>Attempts completed <input id="n" type="number" value="100"></label><label>Attempts/hour <input id="h" type="number" value="60"></label><button onclick="calc()">Calculate</button></div><div id="out" class="card"></div><div class="card"><h2>Need to model a full loot system?</h2><p>Use <a href="../">TinyForge Tools</a> and LootSim for deeper balancing and simulation.</p></div><script>function fmt(x){return Number.isFinite(x)?x.toLocaleString(undefined,{maximumFractionDigits:2}):'—'}function calc(){let p=+document.getElementById('p').value/100,n=Math.max(0,+document.getElementById('n').value),h=Math.max(0,+document.getElementById('h').value);if(!(p>0&&p<=1)){out.innerHTML='Enter a drop chance above 0% and at most 100%.';return}let dry=Math.pow(1-p,n), expected=n*p;let targets=[.5,.75,.9,.95,.99];let rows=targets.map(t=>{let k=Math.ceil(Math.log(1-t)/Math.log(1-p));return `<tr><td>${t*100}%</td><td>${fmt(k)}</td><td>${h?fmt(k/h)+' h':'—'}</td></tr>`}).join('');out.innerHTML=`<div class="grid"><div><b>Chance of ≥1 drop</b><br>${fmt((1-dry)*100)}%</div><div><b>Dry-streak chance</b><br>${fmt(dry*100)}%</div><div><b>Expected drops</b><br>${fmt(expected)}</div><div><b>Average attempts/drop</b><br>${fmt(1/p)}</div></div><h2>Confidence milestones</h2><table><tr><th>Chance</th><th>Attempts</th><th>Grind time</th></tr>${rows}</table>`}calc()</script></body></html>

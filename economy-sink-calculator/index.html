<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Economy Faucet & Sink Calculator | TinyForge</title><meta name="description" content="Free game economy calculator for estimating currency creation, spending, net inflation and sink strength."><style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 18px;background:#10131a;color:#eef}input{width:150px;padding:8px;margin:5px}.card{background:#181d28;padding:22px;border-radius:14px}button{padding:10px 16px}a{color:#8bd}</style></head><body><h1>Game Economy Faucet & Sink Calculator</h1><p>Quickly estimate whether your currency loop creates inflation or contraction.</p><div class="card"><label>Active players <input id="p" type="number" value="10000"></label><br><label>Currency earned/player/day <input id="f" type="number" value="1200"></label><br><label>Currency spent/player/day <input id="s" type="number" value="900"></label><br><label>Other daily sinks <input id="x" type="number" value="500000"></label><br><button onclick="calc()">Calculate</button><p id="o"></p></div><p><a href="../">TinyForge Game Tools</a></p><script>function calc(){let faucet=+p.value*+f.value,sink=+p.value*+s.value + +x.value,net=faucet-sink,ratio=sink/faucet*100;o.innerHTML=`Daily faucet: <b>${faucet.toLocaleString()}</b><br>Daily sinks: <b>${sink.toLocaleString()}</b><br>Net change: <b>${net.toLocaleString()}</b><br>Sink coverage: <b>${ratio.toFixed(1)}%</b><br>${net>0?'Inflationary pressure':'Currency supply is contracting'}`}</script></body></html>

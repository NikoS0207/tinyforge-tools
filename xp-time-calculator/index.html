<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XP & Leveling Time Calculator | TinyForge Game Tools</title><meta name="description" content="Free XP progression calculator. Estimate sessions, hours and days needed to reach a target XP or level goal."><style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 18px;background:#10131a;color:#eef}input{width:150px;padding:8px;margin:5px}.card{background:#181d28;padding:22px;border-radius:14px}button{padding:10px 16px}a{color:#8bd}</style></head><body><h1>XP & Leveling Time Calculator</h1><p>Estimate how long a progression target takes.</p><div class="card"><label>Current XP <input id="c" type="number" value="12000"></label><br><label>Target XP <input id="t" type="number" value="50000"></label><br><label>XP per hour <input id="r" type="number" value="3500"></label><br><label>Hours per session <input id="h" type="number" value="1.5" step="0.1"></label><br><label>Sessions per week <input id="w" type="number" value="5"></label><br><button onclick="calc()">Calculate</button><p id="o"></p></div><p><a href="../">TinyForge Game Tools</a></p><script>function calc(){let need=Math.max(0,+t.value-+c.value),rate=+r.value,hs=+h.value,sw=+w.value,hours=need/rate,sessions=hours/hs,weeks=sessions/sw;o.innerHTML=`XP remaining: <b>${need.toLocaleString()}</b><br>Play time: <b>${hours.toFixed(1)} hours</b><br>Sessions: <b>${Math.ceil(sessions)}</b><br>At your schedule: <b>${weeks.toFixed(1)} weeks</b>`}</script></body></html>

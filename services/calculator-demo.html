<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuickForge — Web Calculator Demo</title><style>body{margin:0;background:#0b1017;color:#eef4fb;font:16px system-ui}.wrap{max-width:760px;margin:60px auto;padding:24px}.card{background:#111923;border:1px solid #29384a;border-radius:18px;padding:25px}a{color:#8ab6ff}h1{font-size:38px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;color:#9fb0c2;margin-bottom:6px}input{width:100%;padding:12px;border:1px solid #34465b;border-radius:9px;background:#0c131c;color:white;font-size:17px}.result{margin-top:18px;background:#10223a;border:1px solid #335b8f;border-radius:12px;padding:18px;font-size:25px;font-weight:900}.muted{color:#9aaabd}.back{display:inline-block;margin-bottom:20px;text-decoration:none}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a class="back" href="index.html">← QuickForge Digital</a><div class="card"><div class="muted">LIVE PORTFOLIO SAMPLE</div><h1>Quote calculator</h1><p class="muted">A small example of turning a formula into a clean responsive browser tool.</p><div class="grid"><div><label>Unit price (€)</label><input id="price" type="number" value="18" min="0" step=".01"></div><div><label>Quantity</label><input id="qty" type="number" value="7" min="0" step="1"></div><div><label>Discount (%)</label><input id="disc" type="number" value="10" min="0" max="100"></div><div><label>Tax (%)</label><input id="tax" type="number" value="25" min="0"></div></div><div class="result" id="out"></div><p class="muted">Source can be extended with custom formulas, tables, charts, local save and CSV/JSON export.</p></div></div><script>const ids=['price','qty','disc','tax'];function calc(){let p=+price.value||0,q=+qty.value||0,d=(+disc.value||0)/100,t=(+tax.value||0)/100;let subtotal=p*q,after=subtotal*(1-d),total=after*(1+t);out.textContent='Total: €'+total.toFixed(2)+' · Before tax: €'+after.toFixed(2);}ids.forEach(x=>document.getElementById(x).addEventListener('input',calc));calc();</script></body></html>

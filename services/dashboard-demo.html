<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuickForge — Dashboard Demo</title><style>body{margin:0;background:#0b1017;color:#eef4fb;font:15px system-ui}.wrap{max-width:1000px;margin:45px auto;padding:22px}a{color:#8ab6ff}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.k,.panel{background:#111923;border:1px solid #2a3848;border-radius:14px;padding:18px}.k span,.muted{color:#94a5b6}.k b{display:block;font-size:28px;margin-top:6px}.two{display:grid;grid-template-columns:1.3fr .7fr;gap:14px;margin-top:14px}.chart{height:260px;display:flex;align-items:end;gap:12px;padding-top:20px}.bar{flex:1;background:#6ca6ff;border-radius:8px 8px 2px 2px}.bar:nth-child(2n){background:#70d6a0}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #293745;text-align:left}th{color:#92a4b7}@media(max-width:750px){.kpis{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a href="index.html">← QuickForge Digital</a><h1>Spreadsheet dashboard sample</h1><p class="muted">Example structure for an Excel/Google Sheets sales tracker.</p><div class="kpis"><div class="k"><span>Revenue</span><b>€8,420</b></div><div class="k"><span>Orders</span><b>127</b></div><div class="k"><span>Avg. order</span><b>€66.30</b></div><div class="k"><span>Target</span><b>84%</b></div></div><div class="two"><div class="panel"><b>Weekly revenue</b><div class="chart"><div class="bar" style="height:42%"></div><div class="bar" style="height:58%"></div><div class="bar" style="height:49%"></div><div class="bar" style="height:76%"></div><div class="bar" style="height:68%"></div><div class="bar" style="height:91%"></div><div class="bar" style="height:84%"></div></div></div><div class="panel"><b>Recent rows</b><table><tr><th>Source</th><th>€</th></tr><tr><td>Direct</td><td>1,940</td></tr><tr><td>Referral</td><td>1,420</td></tr><tr><td>Organic</td><td>3,110</td></tr><tr><td>Other</td><td>1,950</td></tr></table></div></div></div></body></html>
